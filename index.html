<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Memes created by Wordslikerad"
  />
  <title>Drive Gallery</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">Selected images</p>
      <h1>ROBIN MEMES</h1>
    </div>
    <p class="intro">
      Memes created by Wordslikerad
    </p>
  </header>

  <main>
    <div id="status" class="status" role="status">Loading images…</div>
    <section id="gallery" class="gallery" aria-label="Image gallery"></section>
  </main>

  <dialog id="lightbox" class="lightbox">
    <button id="close-lightbox" class="close-button" aria-label="Close image">×</button>
    <img id="lightbox-image" alt="" />
    <p id="lightbox-caption"></p>
  </dialog>

  <script src="/script.js" defer></script>
</body>
</html>
